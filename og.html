<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/src/styles/tokens.css"><link rel="stylesheet" href="/src/styles/fonts.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#F6F5F0;font-family:var(--font-display);color:#0E0E0C}
.card{position:relative;width:1200px;height:630px;padding:64px 72px;box-sizing:border-box}
.meta{font-family:var(--font-mono);font-size:14px;max-width:560px;letter-spacing:.12em;text-transform:uppercase;color:#6F6F69}
.name{margin-top:26px;font-size:150px;line-height:.86;letter-spacing:-.05em;font-weight:500;text-transform:uppercase}
.name b{display:block;font-weight:500;color:#F04E15}
.tag{margin-top:30px;font-family:var(--font-serif);font-size:32px;line-height:1.15;max-width:540px}
.tag em{color:#6F6F69}
.photo{position:absolute;right:72px;top:64px;width:400px;height:500px;border:1.5px solid #0E0E0C;overflow:hidden;background:#EDECE6}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.line{position:absolute;left:0;right:0;bottom:36px;height:1.5px;background:#0E0E0C}
.run{position:absolute;left:72px;bottom:60px;font-family:var(--font-mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:#6F6F69;transform:translateY(-32px)}
</style></head><body><div class="card">
<p class="meta">Founder’s Office · GTM · CS · Superjoin · Bengaluru</p>
<h1 class="name">Sagar<b>Kotian</b></h1>
<p class="tag"><em>First non-eng hire.</em> I bring in the demand, keep the customers, and grade the AI’s homework.</p>
<div class="photo"><img src="/img/hero-800.jpg" onerror="this.src='/img/hero.jpg'"></div>
<div class="line"></div>
</div></body></html>
